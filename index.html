<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MemCards - Criador de Folhas de Flashcards A4</title>
  <meta name="description" content="Aplicação web para criação, edição e impressão de folhas de cards de memorização (flashcards) em formato padrão A4 Sulfite.">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>

  <!-- Barra Superior (Navbar Fixa) -->
  <header class="navbar">
    <button id="btn-hamburger" class="btn-hamburger" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar-menu" title="Abrir menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <div class="navbar-brand">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
      </div>
      <h1 class="brand-title">MemCards</h1>
    </div>

    <div class="navbar-actions">
      <button id="btn-theme-toggle" class="btn btn-secondary btn-icon-only theme-toggle-btn" title="Alternar Modo Escuro / Claro" aria-label="Alternar Modo Escuro / Claro">
        <svg class="theme-icon sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-icon moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <button id="btn-add-sheet-nav" class="btn btn-secondary" title="Adicionar nova folha A4 em branco">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Adicionar Folha
      </button>

      <button id="btn-print-nav" class="btn btn-primary" title="Imprimir ou Salvar como PDF">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        Imprimir / Gerar PDF
      </button>
    </div>
  </header>

  <!-- Área de Trabalho (Viewport Container com rolagem exclusiva) -->
  <main class="viewport-container">
    <!-- Cabeçalho do Grupo de Folhas (Nomeação e estatísticas) -->
    <div id="deck-header-container" class="deck-header-container">
      <div class="deck-title-wrapper">
        <label for="deck-title-input" class="sr-only">Nome do Grupo de Folhas</label>
        <input type="text" id="deck-title-input" class="deck-title-input" placeholder="Nome do grupo de folhas (ex: Biologia - Capítulo 1)..." maxlength="64" autocomplete="off">
      </div>
      <div class="deck-meta-info">
        <span id="deck-stats-badge" class="deck-stats-badge">1 folha • 12 cards</span>
      </div>
    </div>

    <div id="sheets-container">
      <!-- As folhas A4 serão renderizadas dinamicamente aqui via app.js -->
    </div>

    <div class="floating-add-container">
      <button id="btn-add-sheet-bottom" class="btn btn-secondary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Adicionar Nova Folha A4
      </button>
    </div>
  </main>

  <!-- Overlay do Menu Lateral -->
  <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

  <!-- Menu Lateral (Sidebar) -->
  <aside id="sidebar-menu" class="sidebar-menu" aria-hidden="true">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
        </div>
        <span class="sidebar-brand-title">MemCards</span>
      </div>
      <button id="btn-sidebar-close" class="btn-sidebar-close" aria-label="Fechar menu" title="Fechar menu">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <nav class="sidebar-content">
      <ul class="sidebar-nav-list">
        <li class="sidebar-nav-item active">
          <a href="#" id="nav-item-inicio" class="sidebar-nav-link">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Início</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-actions-wrapper">
        <button id="btn-sidebar-new-deck" class="btn btn-primary btn-sidebar-new">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Novo Grupo de Folhas
        </button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-header">
          <span>Folhas e Grupos Salvos</span>
          <span id="sidebar-decks-count" class="sidebar-count-badge">0</span>
        </div>
        <ul id="sidebar-decks-list" class="sidebar-decks-list">
          <!-- Renderizado dinamicamente via JS -->
        </ul>
      </div>
    </nav>
  </aside>
  <!-- Container de Notificações Toast / Push -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
